[project]
name = "avatar-talk"
version = "0.1.0"
requires-python = ">=3.12,<3.14"

[tool.uv.workspace]
members = ["packages/core", "services/agent", "services/api"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.12", "httpx>=0.28"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/core/tests", "services/agent/tests", "services/api/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
