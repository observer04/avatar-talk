[project]
name = "avatar-talk"
version = "0.1.0"
requires-python = ">=3.12,<3.14"

[tool.uv.workspace]
members = ["packages/core", "services/agent", "services/api", "services/avatar_flashhead"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.12", "httpx>=0.28"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "packages/core/tests",
    "services/agent/tests",
    "services/api/tests",
    "services/avatar_flashhead/tests",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["legacy", "services/avatar_flashhead/spike", "services/api/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends()/File() in argument defaults

[tool.ruff.lint.per-file-ignores]
"services/agent/src/agent/cues.py" = ["E501"]  # prompt prose stays one line per paragraph
"services/agent/scripts/*" = ["ASYNC109", "B023"]  # test harness: explicit timeouts, polled lambdas
