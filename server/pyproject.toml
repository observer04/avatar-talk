[project]
name = "avatar-talk-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "pipecat-ai[google,groq,kokoro,local-smart-turn-v3,moonshine,runner,silero,webrtc]>=1.15.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
