[project]
name = "avatar-api"
version = "0.1.0"
description = "Control-plane API: personas, avatar provisioning, LiveKit sessions"
requires-python = ">=3.12"
dependencies = [
    "avatar-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "livekit-api>=1.0",
    "boto3>=1.35",
    "httpx>=0.28",
    "pillow>=11",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[tool.uv.sources]
avatar-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
