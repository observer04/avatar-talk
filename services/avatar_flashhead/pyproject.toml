[project]
name = "avatar-flashhead"
version = "0.1.0"
description = "Self-hosted SoulX-FlashHead avatar worker: joins the LiveKit room and turns TTS audio into synced video"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents>=1.8,<2",
    "numpy>=1.26",
    "aiohttp>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avatar_flashhead"]
